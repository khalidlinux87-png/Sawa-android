# سوا — بناء تطبيق أندرويد (TWA) على خوادم GitHub.
# يُشغَّل يدويّاً من تبويب Actions ← «Build Sawa Android» ← Run workflow، أو تلقائيّاً عند تعديل twa-manifest.json.
# المفتاح لا يُحفظ في المستودع أبداً: يأتي من الأسرار (Settings ← Secrets and variables ← Actions):
#   KEYSTORE_PASSWORD  (إلزاميّ)  كلمة مرور المفتاح — اخترها مرّةً ولا تغيّرها.
#   KEYSTORE_B64       (بعد أوّل تشغيل)  المفتاح مرمَّزاً base64 — تجده في ملفّ keystore-b64.txt داخل أوّل artifact.
#   GH_PAT             (اختياريّ)  رمز وصول fine-grained بصلاحيّة Secrets (write) على هذا المستودع وContents (write) على Sawa-app
#                      ⇒ يحفظ KEYSTORE_B64 تلقائيّاً ويرفع .well-known/assetlinks.json إلى Sawa-app بنفسه.
name: Build Sawa Android
on:
  workflow_dispatch:
  push:
    paths: [ "twa-manifest.json" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      GH_PAT: ${{ secrets.GH_PAT }}
      KEY_ALIAS: sawa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Install Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
      - name: Keystore (from secret, or create on first run)
        id: ks
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::أضف السرّ KEYSTORE_PASSWORD أوّلاً (Settings ← Secrets and variables ← Actions)"; exit 1; }
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n' | base64 -d > signing.keystore
            echo "first=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore signing.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Sawa, O=Sawa, C=SD" >/dev/null 2>&1
            base64 -w0 signing.keystore > keystore-b64.txt
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice::أُنشئ مفتاح توقيع جديد. احفظ محتوى keystore-b64.txt (من الـartifact) في السرّ KEYSTORE_B64 وإلّا تغيّر المفتاح في البناء التالي."
          fi
          FP=$(keytool -list -v -keystore signing.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA256:/{print $2; exit}')
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $FP"
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"%s","sha256_cert_fingerprints":["%s"]}}]\n' \
            "$(jq -r .packageId twa-manifest.json)" "$FP" > assetlinks.json
      - name: Version code = run number
        run: |
          jq --argjson n "${{ github.run_number }}" '.appVersionCode = $n | .appVersionName = ("1.0." + ($n|tostring)) | .appVersion = ("1.0." + ($n|tostring))' twa-manifest.json > m.json && mv m.json twa-manifest.json
      - name: Generate Android project
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Build APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json --signingKeyPath=./signing.keystore --signingKeyAlias="$KEY_ALIAS"
      - name: Collect
        run: |
          mkdir -p out
          cp app-release-signed.apk out/sawa-${{ github.run_number }}.apk
          cp app-release-bundle.aab out/sawa-${{ github.run_number }}.aab 2>/dev/null || true
          cp assetlinks.json out/
          [ -f keystore-b64.txt ] && cp keystore-b64.txt out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: sawa-android-${{ github.run_number }}
          path: out/
          retention-days: 30
      - name: Save KEYSTORE_B64 secret automatically (needs GH_PAT)
        if: steps.ks.outputs.first == 'true' && env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set KEYSTORE_B64 --repo "${{ github.repository }}" < keystore-b64.txt && echo "::notice::حُفظ السرّ KEYSTORE_B64 تلقائيّاً"
      - name: Publish assetlinks.json to Sawa-app (needs GH_PAT)
        if: env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REPO="${{ github.repository_owner }}/Sawa-app"
          SHA=$(gh api "repos/$REPO/contents/.well-known/assetlinks.json" --jq .sha 2>/dev/null || true)
          CUR=$(gh api "repos/$REPO/contents/.well-known/assetlinks.json" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ "$CUR" = "$(cat assetlinks.json)" ]; then echo "assetlinks.json unchanged"; exit 0; fi
          gh api -X PUT "repos/$REPO/contents/.well-known/assetlinks.json" \
            -f message="assetlinks.json for com.sawaaap.app (run ${{ github.run_number }})" \
            -f content="$(base64 -w0 assetlinks.json)" ${SHA:+-f sha="$SHA"} >/dev/null && echo "::notice::رُفع .well-known/assetlinks.json إلى Sawa-app"
