# سوا — تطبيق أندرويد أصليّ (WebView + إشعارات FCM + شاشة مكالمة واردة) — يحلّ محلّ بناء TWA
# المشروع كلّه داخل sawa-native.zip في جذر المستودع؛ هذا الملفّ يفكّه ويبنيه.
# الأسرار: KEYSTORE_B64 · KEYSTORE_PASSWORD (نفس مفتاح TWA ⇒ يُثبَّت تحديثاً فوقه) · GOOGLE_SERVICES_JSON (من Firebase)
name: Android build (native)

on:
  push:
    branches: [main]
    paths: ['sawa-native.zip', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          [ -f sawa-native.zip ] || { echo "::error::ارفع الملفّ sawa-native.zip إلى جذر المستودع"; exit 1; }
          rm -rf native && mkdir native && unzip -q -o sawa-native.zip -d native
          ls -la native native/app
          # أيّ نسخةٍ من الحزمة نبني؟ (يظهر في رقم الإصدار وملخّص التشغيل)
          TAG=$(cat native/SAWA_BUILD 2>/dev/null | tr -d '[:space:]'); [ -n "$TAG" ] || TAG=c72
          echo "SAWA_TAG=$TAG" >> "$GITHUB_ENV"
          {
            echo "## 📦 الحزمة: $TAG — حجم sawa-native.zip: $(( $(stat -c%s sawa-native.zip) / 1024 )) KB"
            for f in app/src/main/java/com/sawaaap/app/AppLock.java app/src/main/java/com/sawaaap/app/QrScan.java app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml; do
              [ -f "native/$f" ] && echo "- ✅ $f" || echo "- ❌ $f (غير موجود — هذه حزمة قديمة)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'   # C115: AGP 8.9.1 (لـ Android 16 / API 36)

      - name: Signing key + fingerprints
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::السرّ KEYSTORE_B64 غير موجود (هو مفتاح تطبيق TWA نفسه)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sawa.keystore"
          ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/sawa.keystore" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -1 | cut -d, -f1)
          [ -n "$ALIAS" ] || { echo "::error::تعذّر فتح المفتاح — تحقّق من KEYSTORE_PASSWORD"; exit 1; }
          echo "KS_PATH=$RUNNER_TEMP/sawa.keystore" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"   # C115: رقمٌ نظيف يظهر في Google Play (الحزمة في ملخّص التشغيل)
          INFO=$(keytool -list -v -keystore "$RUNNER_TEMP/sawa.keystore" -alias "$ALIAS" -storepass "$KEYSTORE_PASSWORD")
          SHA1=$(echo "$INFO" | grep -E "^\s*SHA1:" | head -1 | awk '{print $2}')
          SHA256=$(echo "$INFO" | grep -E "^\s*SHA256:" | head -1 | awk '{print $2}')
          {
            echo "## 🔑 بصمات مفتاح التوقيع"
            echo "أضف **SHA-1** و**SHA-256** إلى تطبيق أندرويد في Firebase (إعدادات المشروع ← تطبيقاتك ← com.sawaaap.app ← Add fingerprint) — يلزم للدخول بـGoogle."
            echo ""
            echo "- alias: \`$ALIAS\`"
            echo "- SHA-1: \`$SHA1\`"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          [ -n "$GS" ] || { echo "::error::أضف السرّ GOOGLE_SERVICES_JSON (محتوى google-services.json من Firebase لتطبيق com.sawaaap.app)"; exit 1; }
          printf '%s' "$GS" > native/app/google-services.json
          grep -q 'com.sawaaap.app' native/app/google-services.json || { echo "::error::google-services.json لا يخصّ com.sawaaap.app — سجّل تطبيق أندرويد بهذا الاسم في Firebase"; exit 1; }
          python3 -c "import json;json.load(open('native/app/google-services.json'))" || { echo "::error::محتوى GOOGLE_SERVICES_JSON ليس JSON صالحاً — الصق الملفّ كاملاً"; exit 1; }

      - name: Build APK + AAB
        working-directory: native
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # C115b: سبب الفشل يُكتب في «Annotations» وملخّص التشغيل (لا حاجة للبحث في السجلّ الطويل)
          set +e
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            {
              echo "## ❌ سبب فشل البناء"
              echo '```'
              grep -E "^e: |error:|\.java:[0-9]+: error|Could not (find|resolve)|What went wrong" -A3 "$RUNNER_TEMP/gradle.log" | head -60
              echo '```'
              echo '```'
              sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "\.java:[0-9]+: error" "$RUNNER_TEMP/gradle.log" | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            W=$(sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | grep -v "What went wrong\|Try:\|^$" | head -6 | tr '\n' ' ')
            echo "::error title=What went wrong::$W"
            exit 1
          fi

      - name: Google Play checks (API 36 + 16 KB pages)
        run: |
          APK=native/app/build/outputs/apk/release/app-release.apk
          python3 - "$APK" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, zipfile, struct
          z = zipfile.ZipFile(sys.argv[1]); bad = []; n = 0
          print("## ✅ فحص Google Play")
          for i in z.infolist():
              if not (i.filename.startswith("lib/arm64-v8a/") and i.filename.endswith(".so")): continue
              n += 1; d = z.read(i.filename)
              if d[:4] != b"\x7fELF" or d[4] != 2: continue
              phoff, = struct.unpack_from("<Q", d, 0x20); phsz, phn = struct.unpack_from("<HH", d, 0x36)
              al = [struct.unpack_from("<Q", d, phoff + k * phsz + 0x30)[0] for k in range(phn) if struct.unpack_from("<I", d, phoff + k * phsz)[0] == 1]
              if al and min(al) < 16384: bad.append(f"{i.filename} (align {min(al)})")
              if i.compress_type == zipfile.ZIP_STORED and i.header_offset % 16384: pass
          print(f"- مكتبات arm64: {n}")
          print("- ✅ كلّها متوافقة مع صفحات 16 KB" if not bad else "- ❌ غير متوافقة مع 16 KB: " + ", ".join(bad))
          PY
          echo "- targetSdk: $(grep -o 'targetSdk [0-9]*' native/app/build.gradle)" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: $VERSION_CODE · versionName: $VERSION_NAME · الحزمة: $SAWA_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect
        run: |
          mkdir -p out
          cp native/app/build/outputs/apk/release/app-release.apk "out/Sawa-${VERSION_NAME}.apk"
          cp native/app/build/outputs/bundle/release/app-release.aab "out/Sawa-${VERSION_NAME}.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Sawa-android-native
          path: out/*
          retention-days: 30
